name: Build and push image
on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ""
      build-args:
        required: false
        type: string
        default: ""

enable-openid-connect: true

jobs:
  build:
    runs-on: docker
    env:
      IMAGE: registry.anurag.sh/containers/${{ inputs.image-name }}
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute commit metadata
        id: commit-meta
        run: echo "committed-at=$(git show -s --format=%ct ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install ortzi
        if: env.PUSH == 'true'
        run: |-
          curl -fsSL https://registry.anurag.sh/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to harbor
        id: login
        if: env.PUSH == 'true'
        run: ortzi registry login containers:push

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.directory }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.directory) }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          labels: |-
            net.inf-k8s.commit-sha=${{ github.sha }}
            net.inf-k8s.committed-at=${{ steps.commit-meta.outputs.committed-at }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Sign image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ortzi registry sign "$IMAGE@$DIGEST"

      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: ortzi registry logout
