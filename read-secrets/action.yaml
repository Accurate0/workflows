name: Read secrets
description: >-
  Export OpenBao secrets into the job's env with `ortzi secrets`, logging in with the run's
  forgejo id token. The caller needs `enable-openid-connect: true`, and the path's app needs a
  ci.secrets grant for this repository in its app.yaml. Values are masked in logs.

inputs:
  paths:
    description: Space-separated OpenBao paths, e.g. "k8s-schemas/resource-schemas"
    required: true
  prefix:
    description: Prepended to every exported variable name
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check for ortzi secrets
      id: check
      shell: bash
      run: |
        if command -v ortzi >/dev/null && ortzi secrets --help >/dev/null 2>&1; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.check.outputs.installed != 'true'
      uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      with:
        packages: secrets

    - name: Export secrets
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        read -ra paths <<< "$PATHS"
        json="$(ortzi secrets env --json --prefix "$PREFIX" "${paths[@]}")"

        jq -r '.[] | split("\n")[] | select(. != "") | "::add-mask::" + .' <<< "$json"

        delimiter="EOF_$(openssl rand -hex 16)"
        jq -r --arg d "$delimiter" 'to_entries[] | "\(.key)<<\($d)\n\(.value)\n\($d)"' <<< "$json" >> "$GITHUB_ENV"
        jq -r 'keys[] | "exported " + .' <<< "$json"
